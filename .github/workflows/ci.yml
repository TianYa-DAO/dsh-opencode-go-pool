name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-check
        run: node tests/selfcheck.mjs
      - name: Package contents
        run: npm pack --dry-run
