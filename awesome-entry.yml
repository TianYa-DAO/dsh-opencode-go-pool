# HOW TO SUBMIT to github.com/awesome-dsh-plugin/awesome-dsh-plugin
#
# 1. Add the topic `dsh-plugin` to this repository.
# 2. Fork awesome-dsh-plugin and add ONE file:
#      data/plugins/TianYa-DAO__dsh-opencode-go-pool.yml
# 3. Copy the block below into that file. The `npm:` key is not allowed: npm is
#    resolved from package.json `repository`.
# 4. Open the PR against the current upstream main. Do not edit the generated
#    READMEs: CI regenerates them on main.
#
# CI requires the dsh.bundle manifest (declared by package.json), a repository
# older than one day, a tarball that resolves, and a passing submission gate.

